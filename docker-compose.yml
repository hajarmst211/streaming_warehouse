services:
  # MinIO: local S3 storage object
  minio:
    image: docker.io/pgsty/silo:latest # pin a RELEASE tag from Docker Hub once it works
    container_name: minio
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse_net

  # Nessie: data catalog (tracks snapshots and schema)
  nessie:
    image: projectnessie/nessie:latest
    container_name: nessie
    ports:
      - "${NESSIE_API_PORT}:19120"
    depends_on:
      - minio
    networks:
      - lakehouse_net

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,DOCKER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - lakehouse_net

  # Kafka UI (Visual Dashboard)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      - kafka
    networks:
      - lakehouse_net

# PySpark with JupyterLab
  pyspark:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: pyspark
    ports:
      - "${PYSPARK_PORT:-8888}:8888" # JupyterLab UI
      - "${SPARK_UI_PORT:-4040}:4040"  # Spark Job UI
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      JUPYTER_TOKEN: "" 

      # Credentials to access MinIO via S3A
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      NESSIE_URI: http://nessie:19120/api/v2
      S3_ENDPOINT: http://minio:9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094

      # 1. ADD THIS: Tell Spark to load all JARs inside the mounted folder
      SPARK_CONF_DIR: /app
      SPARK_EXTRA_CLASSPATH: "/usr/local/spark/jars-extra/*"

    volumes:
      - ./:/app
      # 2. ADD THIS: Mount your local ./jars folder into the container
      - ./jars:/usr/local/spark/jars-extra:ro

    depends_on:
      - minio
      - nessie
      - kafka
    networks:
      - lakehouse_net


# Persist data across container restarts
volumes:
  minio_data:
  kafka_data:

# Internal network
networks:
  lakehouse_net:
    driver: bridge